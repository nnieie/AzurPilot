name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/workflows/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Sync master with upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo sync "${{ github.repository }}" --source wess09/AzurPilot --branch master

          echo "## 同步成功" >> $GITHUB_STEP_SUMMARY
          echo "已使用 GitHub CLI 将 ${{ github.repository }}:master 同步到 wess09/AzurPilot:master。" >> $GITHUB_STEP_SUMMARY
