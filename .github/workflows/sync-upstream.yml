name: Sync Fork with Upstream

on:
  schedule:
    - cron: '5 */12 * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Merge upstream/master
        id: merge
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config pull.rebase false

          git remote add upstream https://github.com/wess09/AzurPilot.git
          git fetch upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already contains upstream/master."
            echo "merged=false" >> "$GITHUB_OUTPUT"
          else
            if ! git merge --no-edit -X ours upstream/master; then
              echo "Merge reported conflicts; only workflow conflicts will be resolved automatically."

              git diff --name-only --diff-filter=U | while IFS= read -r path; do
                case "$path" in
                  .github/workflows/*.yml|.github/workflows/*.yaml)
                    echo "Resolving workflow conflict $path with fork version"
                    if git cat-file -e "HEAD:$path" 2>/dev/null; then
                      git checkout --ours -- "$path"
                      git add "$path"
                    else
                      git rm -f -- "$path"
                    fi
                    ;;
                  *)
                    echo "Leaving non-workflow conflict unresolved for manual review: $path"
                    ;;
                esac
              done

              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "Unresolved non-workflow conflicts remain; refusing to auto-sync:"
                git diff --name-only --diff-filter=U
                exit 1
              fi

              git commit --no-edit
            fi
            echo "merged=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate merged Python changes
        if: steps.merge.outputs.merged == 'true'
        run: python dev_tools/validate_python_changes.py --base HEAD^1 --head HEAD

      - name: Push synced master
        run: |
          set -euo pipefail

          if git diff --quiet origin/master..HEAD; then
            echo "No new merge commit to push."
          else
            git push origin HEAD:master
          fi

          echo "## 同步成功" >> "$GITHUB_STEP_SUMMARY"
          echo "已将 wess09/AzurPilot:master 合并到 ${{ github.repository }}:master。" >> "$GITHUB_STEP_SUMMARY"
          echo "发生同一位置冲突时，默认保留 fork 当前分支的改动。" >> "$GITHUB_STEP_SUMMARY"
