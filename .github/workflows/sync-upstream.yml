name: Sync Fork with Upstream

on:
  schedule:
    - cron: '5 */12 * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Merge upstream/master
        id: merge
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config pull.rebase false

          git remote add upstream https://github.com/wess09/AzurPilot.git
          git fetch upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already contains upstream/master."
            echo "merged=false" >> "$GITHUB_OUTPUT"
          else
            if ! git merge --no-edit -X ours upstream/master; then
              echo "Merge reported conflicts; workflow and modify/delete conflicts will be resolved with the fork version."

              resolve_with_fork_version() {
                local path="$1"

                if git cat-file -e ":2:$path" 2>/dev/null; then
                  git checkout --ours -- "$path"
                  git add -- "$path"
                else
                  git rm -f -- "$path"
                fi
              }

              has_stage() {
                local stage="$1"
                local path="$2"

                git ls-files -u -- "$path" | awk -v stage="$stage" '$3 == stage { found = 1 } END { exit !found }'
              }

              conflicts_file="$RUNNER_TEMP/sync-upstream-conflicts"
              git diff --name-only --diff-filter=U -z > "$conflicts_file"

              while IFS= read -r -d '' path; do
                case "$path" in
                  .github/workflows/*.yml|.github/workflows/*.yaml)
                    echo "Resolving workflow conflict $path with fork version"
                    resolve_with_fork_version "$path"
                    ;;
                  *)
                    if ! has_stage 2 "$path" || ! has_stage 3 "$path"; then
                      echo "Resolving modify/delete conflict $path with fork version"
                      resolve_with_fork_version "$path"
                    else
                      echo "Leaving non-workflow content conflict unresolved for manual review: $path"
                    fi
                    ;;
                esac
              done < "$conflicts_file"

              remaining_conflicts="$RUNNER_TEMP/sync-upstream-remaining-conflicts"
              git diff --name-only --diff-filter=U > "$remaining_conflicts"

              if [ -s "$remaining_conflicts" ]; then
                echo "Unresolved non-workflow content conflicts remain; refusing to auto-sync:"
                cat "$remaining_conflicts"
                exit 1
              fi

              git commit --no-edit --allow-empty
            fi
            echo "merged=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push synced master
        run: |
          set -euo pipefail

          if git diff --quiet origin/master..HEAD; then
            echo "No new merge commit to push."
          else
            git push origin HEAD:master
          fi

          echo "## 同步成功" >> "$GITHUB_STEP_SUMMARY"
          echo "已将 wess09/AzurPilot:master 合并到 ${{ github.repository }}:master。" >> "$GITHUB_STEP_SUMMARY"
          echo "发生 workflow 或修改/删除冲突时，默认保留 fork 当前分支的状态；普通代码内容冲突仍会停止等待人工处理。" >> "$GITHUB_STEP_SUMMARY"
