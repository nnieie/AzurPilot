name: Sync Fork with Upstream

on:
  push:
    branches:
      - master
  schedule:
    - cron: '5 */12 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Sync master with upstream
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          gh repo sync "${{ github.repository }}" --source wess09/AzurPilot --branch master

          echo "## 同步成功" >> $GITHUB_STEP_SUMMARY
          echo "已使用 GitHub CLI 将 ${{ github.repository }}:master 从 wess09/AzurPilot:master 同步。" >> $GITHUB_STEP_SUMMARY
