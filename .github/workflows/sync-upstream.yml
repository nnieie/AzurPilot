name: Sync Fork with Upstream

on:
  schedule:
    - cron: '5 */12 * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Sync upstream/master without workflows
        id: sync
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/wess09/AzurPilot.git
          git fetch upstream master

          state_file=".github/sync-upstream-base"
          upstream_ref="upstream/master"
          upstream_sha="$(git rev-parse "$upstream_ref")"

          if [ -f "$state_file" ] && git cat-file -e "$(tr -d '[:space:]' < "$state_file")^{commit}" 2>/dev/null; then
            base_sha="$(tr -d '[:space:]' < "$state_file")"
          else
            base_sha="$(git merge-base HEAD "$upstream_ref")"
          fi

          echo "Sync base: $base_sha"
          echo "Upstream: $upstream_sha"

          if [ "$base_sha" = "$upstream_sha" ]; then
            echo "Already synced with upstream/master."
            echo "synced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          patch_file="$RUNNER_TEMP/upstream-without-workflows.patch"
          git diff --binary "$base_sha" "$upstream_ref" -- . ':(exclude).github/workflows' ':(exclude).github/workflows/**' > "$patch_file"

          if [ -s "$patch_file" ]; then
            if ! git apply --3way --index "$patch_file"; then
              echo "Failed to apply upstream changes without .github/workflows; manual review is required."
              git status --short
              exit 1
            fi
          else
            echo "Upstream only changed .github/workflows or had no file changes outside that directory."
          fi

          printf '%s\n' "$upstream_sha" > "$state_file"
          git add "$state_file"

          if git diff --cached --quiet; then
            echo "No non-workflow upstream changes to commit."
            echo "synced=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Sync upstream/master without workflows" \
              -m "Upstream: $upstream_sha" \
              -m "Excluded: .github/workflows"
            echo "synced=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push synced master
        run: |
          set -euo pipefail

          if git diff --quiet origin/master..HEAD; then
            echo "No new sync commit to push."
          else
            git push origin HEAD:master
          fi

          echo "## 同步成功" >> "$GITHUB_STEP_SUMMARY"
          echo "已将 wess09/AzurPilot:master 的非 workflow 内容同步到 ${{ github.repository }}:master。" >> "$GITHUB_STEP_SUMMARY"
          echo ".github/workflows 目录不会从上游同步；普通代码内容冲突仍会停止等待人工处理。" >> "$GITHUB_STEP_SUMMARY"
