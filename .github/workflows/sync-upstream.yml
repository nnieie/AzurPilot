name: Sync Fork with Upstream

on:
  schedule:
    - cron: '5 */12 * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Sync upstream/master without workflows
        id: sync
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config commit.gpgsign false

          git remote add upstream https://github.com/wess09/AzurPilot.git
          git fetch upstream master

          state_file=".github/sync-upstream-base"
          upstream_ref="upstream/master"
          fork_head="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse "$upstream_ref")"

          if [ -f "$state_file" ] && git cat-file -e "$(tr -d '[:space:]' < "$state_file")^{commit}" 2>/dev/null; then
            base_sha="$(tr -d '[:space:]' < "$state_file")"
          else
            base_sha="$(git merge-base HEAD "$upstream_ref")"
          fi

          echo "Sync base: $base_sha"
          echo "Upstream: $upstream_sha"

          if [ "$base_sha" = "$upstream_sha" ]; then
            echo "Already synced with upstream/master."
            echo "synced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          resolve_with_fork_version() {
            local path="$1"

            if git cat-file -e ":2:$path" 2>/dev/null; then
              git checkout --ours -- "$path"
              git add -- "$path"
            else
              git rm -f -- "$path"
            fi
          }

          has_stage() {
            local stage="$1"
            local path="$2"

            git ls-files -u -- "$path" | awk -v stage="$stage" '$3 == stage { found = 1 } END { exit !found }'
          }

          restore_workflows_from_fork() {
            git rm -r -f --ignore-unmatch .github/workflows

            if git ls-tree -r --name-only "$fork_head" -- .github/workflows | grep -q .; then
              git checkout "$fork_head" -- .github/workflows
              git add .github/workflows
            fi
          }

          temp_commit="$(git commit-tree "$fork_head^{tree}" -p "$base_sha" -m "Temporary fork tree for upstream sync")"
          git checkout --detach --quiet "$temp_commit"

          if ! git merge --no-ff --no-commit -X ours "$upstream_ref"; then
            echo "Merge reported conflicts; workflow and modify/delete conflicts will be resolved with the fork version."

            conflicts_file="$RUNNER_TEMP/sync-upstream-conflicts"
            git diff --name-only --diff-filter=U -z > "$conflicts_file"

            while IFS= read -r -d '' path; do
              case "$path" in
                .github/workflows|.github/workflows/*)
                  echo "Resolving workflow conflict $path with fork version"
                  resolve_with_fork_version "$path"
                  ;;
                *)
                  if ! has_stage 2 "$path" || ! has_stage 3 "$path"; then
                    echo "Resolving modify/delete conflict $path with fork version"
                    resolve_with_fork_version "$path"
                  else
                    echo "Leaving non-workflow content conflict unresolved for manual review: $path"
                  fi
                  ;;
              esac
            done < "$conflicts_file"

            remaining_conflicts="$RUNNER_TEMP/sync-upstream-remaining-conflicts"
            git diff --name-only --diff-filter=U > "$remaining_conflicts"

            if [ -s "$remaining_conflicts" ]; then
              echo "Unresolved non-workflow content conflicts remain; refusing to auto-sync:"
              cat "$remaining_conflicts"
              exit 1
            fi
          fi

          restore_workflows_from_fork

          printf '%s\n' "$upstream_sha" > "$state_file"
          git add "$state_file"
          result_tree="$(git write-tree)"

          if git diff --quiet "$fork_head" "$result_tree"; then
            echo "No non-workflow upstream changes to commit."
            git update-ref HEAD "$fork_head"
            git reset --mixed --quiet "$fork_head"
            echo "synced=false" >> "$GITHUB_OUTPUT"
          else
            final_commit="$(git commit-tree "$result_tree" -p "$fork_head" \
              -m "Sync upstream/master without workflows" \
              -m "Upstream: $upstream_sha" \
              -m "Excluded: .github/workflows")"
            git update-ref HEAD "$final_commit"
            git reset --mixed --quiet "$final_commit"
            echo "synced=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push synced master
        run: |
          set -euo pipefail

          if git diff --quiet origin/master..HEAD; then
            echo "No new sync commit to push."
          else
            git push origin HEAD:master
          fi

          echo "## 同步成功" >> "$GITHUB_STEP_SUMMARY"
          echo "已将 wess09/AzurPilot:master 的非 workflow 内容同步到 ${{ github.repository }}:master。" >> "$GITHUB_STEP_SUMMARY"
          echo ".github/workflows 目录不会从上游同步；普通代码内容冲突仍会停止等待人工处理。" >> "$GITHUB_STEP_SUMMARY"
